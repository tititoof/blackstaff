    description: Page Object Model login.
    template: |-
      // tests/e2e/pages/login.page.ts
      import type { Page, Locator } from '@playwright/test'
      import { expect } from '@playwright/test'

      export class LoginPage {
        readonly page:          Page
        readonly emailInput:    Locator
        readonly passwordInput: Locator
        readonly submitButton:  Locator
        readonly errorToast:    Locator

        constructor(page: Page) {
          this.page          = page
          this.emailInput    = page.getByLabel('Email')
          this.passwordInput = page.getByLabel('Mot de passe')
          this.submitButton  = page.getByRole('button', { name: 'Se connecter' })
          this.errorToast    = page.locator('.v-snackbar')
        }

        async goto() { await this.page.goto('/login') }

        async login(email: string, password: string) {
          await this.emailInput.fill(email)
          await this.passwordInput.fill(password)
          await this.submitButton.click()
        }

        async expectError(message: string) {
          await this.errorToast.waitFor({ state: 'visible' })
          await expect(this.errorToast).toContainText(message)
        }
      }
  - id: 205
    file: tests/e2e/auth/login.spec.ts
    type: e2e_test
    description: Tests e2e login — formulaire, erreurs, redirection.
    template: |-
      // tests/e2e/auth/login.spec.ts
      import { test, expect } from '@playwright/test'
      import { LoginPage } from '../pages/login.page'

      // Ce fichier ne doit PAS utiliser la session sauvegardée
      test.use({ storageState: { cookies: [], origins: [] } })

      test.describe('Page Login', () => {

        test('affiche le formulaire de connexion', async ({ page }) => {
          const p = new LoginPage(page)
          await p.goto()
          await expect(p.emailInput).toBeVisible()
          await expect(p.passwordInput).toBeVisible()
          await expect(p.submitButton).toBeVisible()
        })

        test('connecte et redirige vers /', async ({ page }) => {
          const p = new LoginPage(page)
          await p.goto()
          await p.login(
            process.env.E2E_USER_EMAIL    || 'test@example.com',
            process.env.E2E_USER_PASSWORD || 'password123'
          )
          await expect(page).not.toHaveURL('/login', { timeout: 5000 })
        })

        test('affiche une erreur avec des identifiants incorrects', async ({ page }) => {
          const p = new LoginPage(page)
          await p.goto()
          await p.login('faux@email.com', 'mauvais')
          await p.expectError('Identifiants incorrects')
          await expect(page).toHaveURL('/login')
        })

        test('valide les champs côté client (champs vides)', async ({ page }) => {
          const p = new LoginPage(page)
          await p.goto()
          await p.submitButton.click()
          await expect(page.getByText('Email requis')).toBeVisible()
          await expect(page.getByText('Mot de passe requis')).toBeVisible()
        })

        test('email invalide affiche une erreur de format', async ({ page }) => {
          const p = new LoginPage(page)
          await p.goto()
          await p.emailInput.fill('pas-un-email')
          await p.submitButton.click()
          await expect(page.getByText('Email invalide')).toBeVisible()
        })

      })
