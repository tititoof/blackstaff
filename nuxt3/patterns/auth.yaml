# Pattern Blackstaff — auth
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Auth Nuxt 3 + Rails JWT httpOnly
  description: 'Génère le système d''authentification complet (login, logout, register, session) avec JWT stocké dans un cookie
    httpOnly via Nitro. Une seule génération par projet.'
  whenToUse:
    mustMatch:
    - 'Créer le système d''authentification'
    - Implémenter le login et logout
    - 'Gérer l''inscription des utilisateurs'
    - Mettre en place la gestion de session
    - Stocker un token JWT en cookie httpOnly
    shouldMatch:
    - Utiliser Nuxt 3 avec Nitro comme proxy
    - 'Communiquer avec une API Rails pour l''auth'
    - Utiliser Pinia pour le store utilisateur
    - Protéger des routes avec un middleware
    mustNotMatch:
    - Créer un CRUD pour un modèle de données
    - Utiliser OAuth ou un provider externe (ce pattern est pour JWT custom)
    - Utiliser une autre technologie que Rails pour le backend
    examples:
    - prompt: 'Créer le système de login et register pour l''application'
      match: true
      reason: 'Correspond parfaitement : auth complète avec login/register.'
    - prompt: Créer le CRUD pour les articles
      match: false
      reason: 'Ne correspond pas : c''est un CRUD, pas de l''authentification.'
    - prompt: Ajouter la page de connexion
      match: true
      reason: 'Correspond : mise en place du login.'
    decisionTree:
      question1: 'Est-ce que la demande concerne l''authentification, le login, le logout ou l''inscription ?'
      ifYes: ✅ Utiliser ce pattern
      ifNo: ❌ Ne pas utiliser ce pattern
  files:
  - id: 1
    file: server/api/auth/login.post.ts
    type: server
    description: Route Nitro POST /api/auth/login — appelle Rails, pose le cookie httpOnly.
    template: |-
      // server/api/auth/login.post.ts
      import type { LoginPayload, AuthResponse } from '~/types/Auth'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const body   = await readBody<LoginPayload>(event)

        if (!body?.email || !body?.password) {
          throw createError({ statusCode: 400, message: 'Email et mot de passe requis' })
        }

        const data = await $fetch<AuthResponse>(`${config.railsApiBase}/auth/login`, {
          method: 'POST',
          body
        })

        // Le token ne touche JAMAIS le JS client — cookie httpOnly uniquement
        setCookie(event, 'auth_token', data.token, {
          httpOnly: true,
          secure:   process.env.NODE_ENV === 'production',
          sameSite: 'lax',
          maxAge:   60 * 60 * 24 * 7  // 7 jours
        })

        // On renvoie l'utilisateur mais JAMAIS le token
        return { user: data.user }
      })
  - id: 2
    file: server/api/auth/register.post.ts
    type: server
    description: Route Nitro POST /api/auth/register — crée un compte et pose le cookie.
    template: |-
      // server/api/auth/register.post.ts
      import type { RegisterPayload, AuthResponse } from '~/types/Auth'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const body   = await readBody<RegisterPayload>(event)

        if (!body?.email || !body?.password) {
          throw createError({ statusCode: 400, message: 'Email et mot de passe requis' })
        }

        const data = await $fetch<AuthResponse>(`${config.railsApiBase}/auth/register`, {
          method: 'POST',
          body
        })

        setCookie(event, 'auth_token', data.token, {
          httpOnly: true,
          secure:   process.env.NODE_ENV === 'production',
          sameSite: 'lax',
          maxAge:   60 * 60 * 24 * 7
        })

        return { user: data.user }
      })
  - id: 3
    file: server/api/auth/logout.post.ts
    type: server
    description: Route Nitro POST /api/auth/logout — invalide le cookie.
    template: |-
      // server/api/auth/logout.post.ts
      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token  = getCookie(event, 'auth_token')

        // Notifier Rails si le token existe (invalidation côté serveur)
        if (token) {
          try {
            await $fetch(`${config.railsApiBase}/auth/logout`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` }
            })
          } catch { /* on supprime le cookie même si Rails échoue */ }
        }

        deleteCookie(event, 'auth_token')
        return { success: true }
      })
  - id: 4
    file: server/api/auth/me.get.ts
    type: server
    description: 'Route Nitro GET /api/auth/me — retourne l''utilisateur courant depuis Rails.'
    template: |-
      // server/api/auth/me.get.ts
      import type { User } from '~/types/Auth'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token  = getCookie(event, 'auth_token')

        if (!token) {
          throw createError({ statusCode: 401, message: 'Non authentifié' })
        }

        return await $fetch<User>(`${config.railsApiBase}/auth/me`, {
          headers: { Authorization: `Bearer ${token}` }
        })
      })
  - id: 5
    file: types/Auth.ts
    type: type
    description: 'Interfaces TypeScript pour l''authentification.'
    template: |-
      // types/Auth.ts

      export interface User {
        id: number
        email: string
        name?: string
        // Ajoute ici les champs spécifiques à ton modèle User Rails
      }

      export interface LoginPayload {
        email:    string
        password: string
      }

      export interface RegisterPayload {
        email:            string
        password:         string
        password_confirmation: string
        name?:            string
        // Ajoute ici les champs spécifiques à ton inscription
      }

      export interface AuthResponse {
        token: string
        user:  User
      }
  - id: 6
    file: stores/useAuthStore.ts
    type: store
    description: 'Store Pinia pour l''authentification — user courant, état de session.'
    template: |-
      // stores/useAuthStore.ts
      import type { User } from '~/types/Auth'

      export const useAuthStore = defineStore('auth', {
        state: () => ({
          user: null as User | null
        }),

        getters: {
          isAuthenticated: (state): boolean => !!state.user,
          userId: (state): number | null => state.user?.id ?? null
        },

        actions: {
          setUser(user: User) {
            this.user = user
          },
          logout() {
            this.user = null
          }
        }
      })
  - id: 7
    file: composables/useAuth.ts
    type: composable_global
    description: Composable central pour login, logout, register et hydratation de session.
    template: |-
      // composables/useAuth.ts
      import type { LoginPayload, RegisterPayload } from '~/types/Auth'

      export const useAuth = () => {
        const store = useAuthStore()

        const login = async (payload: LoginPayload) => {
          const { user } = await $fetch('/api/auth/login', {
            method: 'POST',
            body: payload,
            credentials: 'include'
          })
          store.setUser(user)
          return user
        }

        const register = async (payload: RegisterPayload) => {
          const { user } = await $fetch('/api/auth/register', {
            method: 'POST',
            body: payload,
            credentials: 'include'
          })
          store.setUser(user)
          return user
        }

        const logout = async () => {
          await $fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
          store.logout()
          await navigateTo('/login')
        }

        // Hydrate le store depuis Rails au chargement (SSR safe)
        const fetchMe = async () => {
          try {
            const user = await $fetch('/api/auth/me', { credentials: 'include' })
            store.setUser(user)
          } catch {
            store.logout()
          }
        }

        return { login, register, logout, fetchMe }
      }
  - id: 8
    file: middleware/auth.ts
    type: middleware
    description: Middleware route pour protéger les pages authentifiées.
    template: |-
      // middleware/auth.ts
      export default defineNuxtRouteMiddleware(() => {
        const authStore = useAuthStore()
        if (!authStore.isAuthenticated) {
          return navigateTo('/login')
        }
      })
  - id: 9
    file: middleware/guest.ts
    type: middleware
    description: Middleware route pour rediriger les utilisateurs déjà connectés (login/register).
    template: |-
      // middleware/guest.ts
      export default defineNuxtRouteMiddleware(() => {
        const authStore = useAuthStore()
        if (authStore.isAuthenticated) {
          return navigateTo('/')
        }
      })
  - id: 10
    file: plugins/auth.ts
    type: plugin
    description: 'Plugin Nuxt — hydrate le store auth au démarrage de l''app (client-side).'
    template: |-
      // plugins/auth.ts
      export default defineNuxtPlugin(async () => {
        const { fetchMe } = useAuth()
        // Hydrate uniquement côté client pour éviter les problèmes SSR avec les cookies
        if (import.meta.client) {
          await fetchMe()
        }
      })
  - id: 11
    file: pages/login.vue
    type: page
    description: Page de connexion.
    template: |-
      <!-- pages/login.vue -->
      <script setup lang="ts">
      definePageMeta({ middleware: 'guest' })

      const { login } = useAuth()
      const { error: notifyError } = useNotification()

      const form = reactive({
        email:    '',
        password: ''
      })

      const loading = ref(false)

      const rules = {
        email: [
          (v: unknown) => !!v || 'Email requis',
          (v: unknown) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v)) || 'Email invalide'
        ],
        password: [
          (v: unknown) => !!v || 'Mot de passe requis',
          (v: unknown) => String(v).length >= 6 || 'Minimum 6 caractères'
        ]
      }

      const onSubmit = async () => {
        loading.value = true
        try {
          await login(form)
          await navigateTo('/')
        } catch (e: any) {
          notifyError(e.data?.message || 'Identifiants incorrects')
        } finally {
          loading.value = false
        }
      }
      </script>

      <template>
        <v-container max-width="480" class="mt-16">
          <v-card elevation="4" class="pa-6">
            <v-card-title class="text-h5 mb-4">Connexion</v-card-title>
            <v-form @submit.prevent="onSubmit">
              <v-text-field
                v-model="form.email"
                label="Email"
                type="email"
                :rules="rules.email"
                class="mb-2"
              />
              <v-text-field
                v-model="form.password"
                label="Mot de passe"
                type="password"
                :rules="rules.password"
                class="mb-4"
              />
              <v-btn type="submit" color="primary" :loading="loading" block>
                Se connecter
              </v-btn>
              <div class="text-center mt-4">
                <NuxtLink to="/register">Pas encore de compte ?</NuxtLink>
              </div>
            </v-form>
          </v-card>
        </v-container>
      </template>
  - id: 12
    file: pages/register.vue
    type: page
    description: 'Page d''inscription.'
    template: |-
      <!-- pages/register.vue -->
      <script setup lang="ts">
      definePageMeta({ middleware: 'guest' })

      const { register } = useAuth()
      const { error: notifyError } = useNotification()

      const form = reactive({
        name:                  '',
        email:                 '',
        password:              '',
        password_confirmation: ''
      })

      const loading = ref(false)

      const rules = {
        name: [
          (v: unknown) => !!v || 'Nom requis'
        ],
        email: [
          (v: unknown) => !!v || 'Email requis',
          (v: unknown) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v)) || 'Email invalide'
        ],
        password: [
          (v: unknown) => !!v || 'Mot de passe requis',
          (v: unknown) => String(v).length >= 8 || 'Minimum 8 caractères'
        ],
        password_confirmation: [
          (v: unknown) => !!v || 'Confirmation requise',
          (v: unknown) => v === form.password || 'Les mots de passe ne correspondent pas'
        ]
      }

      const onSubmit = async () => {
        loading.value = true
        try {
          await register(form)
          await navigateTo('/')
        } catch (e: any) {
          notifyError(e.data?.message || 'Erreur lors de l\'inscription')
        } finally {
          loading.value = false
        }
      }
      </script>

      <template>
        <v-container max-width="480" class="mt-16">
          <v-card elevation="4" class="pa-6">
            <v-card-title class="text-h5 mb-4">Créer un compte</v-card-title>
            <v-form @submit.prevent="onSubmit">
              <v-text-field v-model="form.name"  label="Nom"   :rules="rules.name"  class="mb-2" />
              <v-text-field v-model="form.email" label="Email" :rules="rules.email" type="email" class="mb-2" />
              <v-text-field v-model="form.password" label="Mot de passe" type="password" :rules="rules.password" class="mb-2" />
              <v-text-field
                v-model="form.password_confirmation"
                label="Confirmer le mot de passe"
                type="password"
                :rules="rules.password_confirmation"
                class="mb-4"
              />
              <v-btn type="submit" color="primary" :loading="loading" block>
                S'inscrire
              </v-btn>
              <div class="text-center mt-4">
                <NuxtLink to="/login">Déjà un compte ?</NuxtLink>
              </div>
            </v-form>
          </v-card>
        </v-container>
      </template>
  - id: 13
    file: composables/useNotification.ts
    type: composable_global
    description: Composable global pour afficher des toasts — partagé avec le pattern CRUD.
    template: |-
      // composables/useNotification.ts
      type NotificationType = 'success' | 'error' | 'warning' | 'info'

      const state = reactive({
        show:    false,
        message: '',
        type:    'success' as NotificationType,
        timeout: 3000
      })

      export const useNotification = () => {
        const notify = (message: string, type: NotificationType = 'success', timeout = 3000) => {
          state.message = message
          state.type    = type
          state.timeout = timeout
          state.show    = true
        }

        const success = (message: string) => notify(message, 'success')
        const error   = (message: string) => notify(message, 'error')
        const warning = (message: string) => notify(message, 'warning')

        return { state, notify, success, error, warning }
      }
  - id: 14
    file: components/ui/AppSnackbar.vue
    type: component_global
    description: Snackbar global branché sur useNotification — partagé avec le pattern CRUD.
    template: |-
