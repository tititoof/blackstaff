# Pattern Blackstaff — builder
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Monteur (Builder) — Nuxt 3
  description: Construit des objets complexes étape par étape via un chaînage fluide. Idéal pour les requêtes API avec filtres/pagination/tri,
    les configurations de formulaire, les payloads complexes avant envoi à Rails.
  whenToUse:
    mustMatch:
    - Construire des requêtes API complexes avec filtres, pagination, tri
    - Construire des objets de configuration de formulaire étape par étape
    - Construire des payloads complexes avant envoi à Rails
    - Construire des objets avec de nombreux paramètres optionnels
    - Construire des objets de configuration de graphiques
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - Vouloir un chaînage fluide lisible
    - Éviter des constructeurs avec de nombreux paramètres
    mustNotMatch:
    - Créer un objet simple sans options
    - 'Créer des familles d''objets liés (utiliser Abstract Factory)'
    - Adapter deux interfaces (utiliser Adapter)
    examples:
    - prompt: Créer un builder de requêtes API avec filtres et pagination
      match: true
      reason: Construction complexe étape par étape avec chaînage fluide.
    - prompt: Créer un builder de configuration de formulaire
      match: true
      reason: Objet complexe avec de nombreux champs optionnels à configurer.
    - prompt: Créer un composant bouton
      match: false
      reason: 'Objet simple — pas besoin d''un builder.'
    decisionTree:
      question1: As-tu un objet complexe avec de nombreuses options de construction ?
      ifYes:
        question2: La construction se fait-elle en plusieurs étapes indépendantes ?
        ifYes: ✅ Utiliser ce pattern
        ifNo: ⚠️ Envisager un simple objet de config à la place
      ifNo: ❌ Ne pas utiliser ce pattern
  files:
  - id: 1
    file: 'utils/builders/{builder}/interfaces.ts'
    type: type
    description: 'Interface du produit construit par le builder {Builder}.'
    template: |-
      // utils/builders/{builder}/interfaces.ts

      // Produit final construit par le builder
      export interface {Builder}Product {
        // Ajoute ici les champs du produit final
        // Exemple pour une requête :
        // page:      number
        // perPage:   number
        // sortBy:    string
        // sortOrder: 'asc' | 'desc'
        // filters:   Record<string, string | number | boolean>
        // search:    string
      }
  - id: 2
    file: 'utils/builders/{builder}/{Builder}Builder.ts'
    type: util
    description: 'Implémentation du builder {Builder} avec chaînage fluide et factory function.'
    template: |-
      // utils/builders/{builder}/{Builder}Builder.ts
      import type { {Builder}Product } from './interfaces'

      export class {Builder}Builder {
        private product: {Builder}Product = {
          // Ajoute ici les valeurs par défaut de chaque champ
        }

        // Ajoute ici les méthodes de construction
        // Chaque méthode retourne `this` pour le chaînage fluide
        // Exemple :
        // withPage(page: number): this {
        //   this.product.page = page
        //   return this
        // }

        // build() retourne le produit final — toujours la dernière méthode appelée
        build(): {Builder}Product {
          return { ...this.product }
        }

        // toParams() convertit en format adapté à l'usage (query params, body, etc.)
        toParams(): Record<string, unknown> {
          // Ajoute ici la conversion du produit en paramètres
          return { ...this.product }
        }
      }

      // Factory function — pas de `new` direct dans les composables
      export const create{Builder} = (): {Builder}Builder => new {Builder}Builder()
  - id: 3
    file: 'composables/{builder}/use{Builder}.ts'
    type: composable
    description: 'Composable utilisant le builder {Builder} pour construire des requêtes ou configs.'
    template: |-
      // composables/{builder}/use{Builder}.ts
      import { create{Builder} } from '~/utils/builders/{builder}/{Builder}Builder'
      import type { {Builder}Product } from '~/utils/builders/{builder}/interfaces'

      export const use{Builder} = () => {
        // Exemple d'utilisation du builder dans un composable
        const buildWithDefaults = (options?: Partial<{Builder}Product>) => {
          const builder = create{Builder}()
          // Ajoute ici la logique de construction avec les options
          // Exemple :
          // if (options?.page)   builder.withPage(options.page)
          // if (options?.search) builder.withSearch(options.search)
          return builder
        }

        return { create{Builder}, buildWithDefaults }
      }
  - id: 4
    file: 'tests/utils/builders/{builder}/{Builder}Builder.spec.ts'
    type: test
    testedFileId: 2
    description: 'Tests unitaires du builder {Builder} — chaînage, valeurs par défaut, build().'
    template: |-
      // tests/utils/builders/{builder}/{Builder}Builder.spec.ts
      import { describe, it, expect } from 'vitest'
      import { create{Builder} } from '~/utils/builders/{builder}/{Builder}Builder'

      describe('{Builder}Builder', () => {

        it('build() retourne un produit avec les valeurs par défaut', () => {
          const product = create{Builder}().build()
          expect(product).toBeDefined()
          // Ajoute ici les assertions sur les valeurs par défaut
        })

        it('le chaînage fluide retourne la même instance', () => {
          const builder = create{Builder}()
          // Vérifie que chaque méthode retourne `this`
          // Ajoute ici un appel chaîné et vérifie l'instance
          expect(builder).toBeInstanceOf(Object)
        })

        it('build() retourne un nouvel objet à chaque appel', () => {
          const builder  = create{Builder}()
          const product1 = builder.build()
          const product2 = builder.build()
          expect(product1).not.toBe(product2)
          expect(product1).toEqual(product2)
        })

        it('toParams() retourne un objet serialisable', () => {
          const params = create{Builder}().toParams()
          expect(typeof params).toBe('object')
          expect(() => JSON.stringify(params)).not.toThrow()
        })

        // Ajoute ici les tests de chaque méthode de construction
        // Exemple :
        // it('withPage() définit la page', () => {
        //   const product = create{Builder}().withPage(3).build()
        //   expect(product.page).toBe(3)
        // })

      })
  commentaire: 'Builder générique pour Nuxt 3 + TypeScript. Placeholders : {builder} (kebab-case) et {Builder} (PascalCase).
    Exemple : builder=query, Builder=Query ou builder=form-config, Builder=FormConfig.'
  actions:
  - id: 1
    file: 'utils/builders/{builder}/interfaces.ts'
    type: type
    description: Interface du produit construit
  - id: 2
    file: 'utils/builders/{builder}/{Builder}Builder.ts'
    type: util
    description: Builder avec chaînage fluide et factory function
  - id: 3
    file: 'composables/{builder}/use{Builder}.ts'
    type: composable
    description: Composable utilisant le builder
  - id: 4
    file: 'tests/utils/builders/{builder}/{Builder}Builder.spec.ts'
    type: test
    testedFileId: 2
    description: Tests du builder — chaînage et build()
