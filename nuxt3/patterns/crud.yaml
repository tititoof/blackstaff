        message?:   string
        confirmLabel?: string
        confirmColor?: string
      }

      interface Emits {
        (e: 'update:modelValue', value: boolean): void
        (e: 'confirm'): void
      }

      const props = withDefaults(defineProps<Props>(), {
        loading:      false,
        title:        'Confirmer',
        message:      'Êtes-vous sûr de vouloir effectuer cette action ?',
        confirmLabel: 'Confirmer',
        confirmColor: 'error'
      })

      const emit = defineEmits<Emits>()
