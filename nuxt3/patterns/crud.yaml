  - id: 13
    file: components/ui/AppSearch.vue
    type: component_global
    description: Champ de recherche générique avec debounce.
    template: |-
      <!-- components/ui/AppSearch.vue -->
      <template>
        <v-text-field
          v-model="local"
          :label="props.label"
          append-inner-icon="mdi-magnify"
          clearable
          class="mb-6"
        />
      </template>

      <script setup lang="ts">
      interface Props {
        modelValue: string
        label?:     string
        debounce?:  number
      }

      interface Emits {
        (e: 'update:modelValue', value: string): void
      }

      const props = withDefaults(defineProps<Props>(), {
        label:    'Rechercher',
        debounce: 300
      })

      const emit    = defineEmits<Emits>()
      const local   = ref(props.modelValue)
      let   timer: ReturnType<typeof setTimeout>

      watch(local, (val) => {
        clearTimeout(timer)
        timer = setTimeout(() => emit('update:modelValue', val), props.debounce)
      })
      </script>

      
  - id: 14
    file: composables/useNotification.ts
    type: composable_global
    description: Composable global pour afficher des toasts de succès/erreur via Vuetify snackbar.
    template: |-
      // composables/useNotification.ts
      type NotificationType = 'success' | 'error' | 'warning' | 'info'

      const state = reactive({
        show:    false,
        message: '',
        type:    'success' as NotificationType,
        timeout: 3000
      })

      export const useNotification = () => {
        const notify = (message: string, type: NotificationType = 'success', timeout = 3000) => {
          state.message = message
          state.type    = type
          state.timeout = timeout
          state.show    = true
        }

        const success = (message: string) => notify(message, 'success')
        const error   = (message: string) => notify(message, 'error')
        const warning = (message: string) => notify(message, 'warning')

        return { state, notify, success, error, warning }
      }
      // À placer dans app.vue :
      // <AppSnackbar />
