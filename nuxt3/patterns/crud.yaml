  - id: 7
    file: composables/useApi.ts
    type: composable_global
    description: Composable central global pour les appels API — partagé entre tous les domaines.
    template: |-
      // composables/useApi.ts
      export const useApi = () => {
        const apiFetch = <T>(
          endpoint: string,
          options: Parameters<typeof $fetch>[1] = {}
        ): Promise<T> => {
          return $fetch<T>(`/api${endpoint}`, {
            ...options,
            credentials: 'include'
          })
        }
        return { apiFetch }
      }
  - id: 8
    file: 'composables/{domain}/use{Domain}s.ts'
    type: composable
    description: 'Composable pour les opérations CRUD sur les {domain}.'
    template: |-
      // composables/{domain}/use{Domain}s.ts
      import type {
        {Domain},
        {Domain}Paginated,
        Create{Domain}Payload,
        Update{Domain}Payload
      } from '~/types/{Domain}'

      export const use{Domain}s = () => {
        const { apiFetch } = useApi()

        const list = (page = 1, query?: Record<string, string | number>) =>
          apiFetch<{Domain}Paginated>(`/{domain}s`, { query: { page, ...query } })

        const get = (id: number) =>
          apiFetch<{Domain}>(`/{domain}s/${id}`)

        const create = (payload: Create{Domain}Payload) =>
          apiFetch<{Domain}>(`/{domain}s`, { method: 'POST', body: payload })

        const update = (id: number, payload: Update{Domain}Payload) =>
          apiFetch<{Domain}>(`/{domain}s/${id}`, { method: 'PUT', body: payload })

        const remove = (id: number) =>
          apiFetch<void>(`/{domain}s/${id}`, { method: 'DELETE' })

        return { list, get, create, update, remove }
      }
  - id: 9
    file: 'composables/{domain}/use{Domain}Form.ts'
    type: composable
    description: 'Composable pour gérer le formulaire {Domain} avec validation.'
    template: |-
      // composables/{domain}/use{Domain}Form.ts
      import type { Create{Domain}Payload, Update{Domain}Payload } from '~/types/{Domain}'

      export const use{Domain}Form = (initialData?: Partial<Create{Domain}Payload>) => {
        const initialState: Create{Domain}Payload = {
          // Ajoute ici les valeurs par défaut pour chaque champ
          ...initialData
        }

        const form = reactive<Create{Domain}Payload>({ ...initialState })

        const rules = {
          // Ajoute ici les règles de validation pour chaque champ
        }

        const reset = () => Object.assign(form, initialState)

        const isValid = computed(() =>
          Object.entries(rules).every(([key, fieldRules]) =>
            (fieldRules as Array<(v: unknown) => true | string>)
              .every(rule => rule((form as Record<string, unknown>)[key]) === true)
          )
        )

        const fill = (data: Partial<Create{Domain}Payload | Update{Domain}Payload>) =>
          Object.assign(form, data)

        return { form, rules, reset, isValid, fill }
      }
  - id: 10
    file: 'stores/{domain}Store.ts'
    type: store
    description: 'Store Pinia dédié au domaine {Domain} : liste, item courant, loading, erreurs.'
    template: |-
      // stores/{domain}Store.ts
      import type { {Domain}, {Domain}Paginated } from '~/types/{Domain}'

      export const use{Domain}Store = defineStore('{domain}', {
        state: () => ({
          items:       [] as {Domain}[],
          currentItem: null as {Domain} | null,
          loading:     false,
          error:       null as string | null,
          meta: {
            total:       0,
            page:        1,
            per_page:    10,
            total_pages: 0
          }
        }),

        getters: {
          totalPages: (state): number => state.meta.total_pages,
          isEmpty:    (state): boolean => state.items.length === 0 && !state.loading
        },

        actions: {
          setList(data: {Domain}Paginated) {
            this.items = data.{domain}s
            this.meta  = data.meta
          },
          setCurrentItem(item: {Domain} | null) {
            this.currentItem = item
          },
          setLoading(val: boolean) {
            this.loading = val
          },
          setError(msg: string | null) {
            this.error = msg
          },
          removeItem(id: number) {
            this.items = this.items.filter(i => i.id !== id)
            this.meta.total--
          }
        }
      })
  - id: 11
    file: components/dialogs/ConfirmDialog.vue
    type: component_global
    description: Dialogue de confirmation générique réutilisable dans tout le projet.
    template: |-
      <!-- components/dialogs/ConfirmDialog.vue -->
      <template>
        <v-dialog
          :model-value="props.modelValue"
          @update:model-value="emit('update:modelValue', $event)"
          max-width="500"
        >
