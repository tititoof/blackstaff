# Pattern Blackstaff — crud
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: CRUD Full Stack Nuxt 3 + Rails
  description: 'Génère un CRUD complet avec frontend (Nuxt 3) et backend (Nitro proxy vers Rails). Tous les fichiers sont
    organisés par domaine ({domain}) et les placeholders doivent être remplacés.'
  whenToUse:
    mustMatch:
    - Créer un CRUD complet pour un modèle de données
    - Créer le CRUD pour un modèle
    - CRUD pour un modèle avec des champs
    - Gérer des opérations de création, lecture, mise à jour et suppression
    - Utiliser Nuxt 3 avec Nitro pour le backend
    - Avoir besoin de formulaires avec validation
    - Afficher des listes paginées
    shouldMatch:
    - Utiliser Vuetify pour les composants UI
    - Centraliser la logique API dans des composables
    - Séparer les composants Smart et Dumb
    - 'Utiliser Pinia pour la gestion d''état'
    - 'Avoir besoin de middleware d''authentification'
    mustNotMatch:
    - Créer une application mobile (ce pattern est pour le web)
    - Utiliser un autre framework que Nuxt 3
    - Ne pas avoir besoin de backend (ce pattern inclut des routes API)
    - Utiliser une autre technologie que Rails pour le backend
    - Créer une application sans authentification
    examples:
    - prompt: 'Créer un système de gestion d''articles avec liste, création, édition et suppression'
      match: true
      reason: 'Correspond parfaitement : CRUD complet pour un modèle (Article) avec toutes les opérations.'
    - prompt: Créer une page de profil utilisateur avec modification des informations
      match: true
      reason: 'Correspond : CRUD pour un modèle (User) avec opérations de mise à jour.'
    - prompt: Créer une API REST avec Express.js
      match: false
      reason: 'Ne correspond pas : ce pattern est pour Nuxt 3 + Rails, pas Express.js.'
    decisionTree:
      question1: 'Est-ce que la demande concerne la création d''un système de gestion de données avec des opérations CRUD
        ?'
      ifYes:
        question2: Est-ce que le projet utilise Nuxt 3 avec Nitro pour le backend ?
        ifYes:
          question3: Est-ce que le backend est une API Rails ?
          ifYes: ✅ Utiliser ce pattern
          ifNo: ❌ Ne pas utiliser ce pattern (backend non compatible)
        ifNo: ❌ Ne pas utiliser ce pattern (technologie non compatible)
      ifNo: ❌ Ne pas utiliser ce pattern (pas un CRUD)
  files:
  - id: 1
    file: 'server/api/{domain}/index.get.ts'
    type: server
    description: 'Route Nitro pour lister les {domain} (GET) avec pagination et recherche.'
    template: |-
      // server/api/{domain}/index.get.ts
      import type { {Domain}Paginated } from '~/types/{Domain}'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token = getCookie(event, 'auth_token')

        if (!token) {
          throw createError({ statusCode: 401, message: 'Non authentifié' })
        }

        const query = getQuery(event)

        return await $fetch<{Domain}Paginated>(`${config.railsApiBase}/{domain}s`, {
          headers: { Authorization: `Bearer ${token}` },
          query
        })
      })
  - id: 2
    file: 'server/api/{domain}/[id].get.ts'
    type: server
    description: 'Route Nitro pour récupérer un {domain} par ID (GET).'
    template: |-
      // server/api/{domain}/[id].get.ts
      import type { {Domain} } from '~/types/{Domain}'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token = getCookie(event, 'auth_token')
        const id = getRouterParam(event, 'id')

        if (!token) throw createError({ statusCode: 401, message: 'Non authentifié' })
        if (!id)    throw createError({ statusCode: 400, message: 'ID manquant' })

        return await $fetch<{Domain}>(`${config.railsApiBase}/{domain}s/${id}`, {
          headers: { Authorization: `Bearer ${token}` }
        })
      })
  - id: 3
    file: 'server/api/{domain}/index.post.ts'
    type: server
    description: 'Route Nitro pour créer un {domain} (POST).'
    template: |-
      // server/api/{domain}/index.post.ts
      import type { Create{Domain}Payload } from '~/types/{Domain}'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token = getCookie(event, 'auth_token')

        if (!token) throw createError({ statusCode: 401, message: 'Non authentifié' })

        const body = await readBody<Create{Domain}Payload>(event)
        if (!body) throw createError({ statusCode: 400, message: 'Body manquant' })

        return await $fetch<{Domain}>(`${config.railsApiBase}/{domain}s`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body
        })
      })
  - id: 4
    file: 'server/api/{domain}/[id].put.ts'
    type: server
    description: 'Route Nitro pour mettre à jour un {domain} (PUT).'
    template: |-
      // server/api/{domain}/[id].put.ts
      import type { Update{Domain}Payload } from '~/types/{Domain}'

      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token = getCookie(event, 'auth_token')
        const id = getRouterParam(event, 'id')

        if (!token) throw createError({ statusCode: 401, message: 'Non authentifié' })
        if (!id)    throw createError({ statusCode: 400, message: 'ID manquant' })

        const body = await readBody<Update{Domain}Payload>(event)

        return await $fetch<{Domain}>(`${config.railsApiBase}/{domain}s/${id}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}` },
          body
        })
      })
  - id: 5
    file: 'server/api/{domain}/[id].delete.ts'
    type: server
    description: 'Route Nitro pour supprimer un {domain} (DELETE).'
    template: |-
      // server/api/{domain}/[id].delete.ts
      export default defineEventHandler(async (event) => {
        const config = useRuntimeConfig()
        const token = getCookie(event, 'auth_token')
        const id = getRouterParam(event, 'id')

        if (!token) throw createError({ statusCode: 401, message: 'Non authentifié' })
        if (!id)    throw createError({ statusCode: 400, message: 'ID manquant' })

        await $fetch(`${config.railsApiBase}/{domain}s/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        })

        return { success: true }
      })
