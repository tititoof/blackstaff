    file: 'tests/e2e/{domain}s/list.spec.ts'
    type: e2e_test
    description: 'Tests e2e liste {Domain} — affichage, recherche, redirection auth.'
    template: |-
      // tests/e2e/{domain}s/list.spec.ts
      import { test, expect } from '@playwright/test'
      import { {Domain}sPage } from '../pages/{domain}s.page'

      test.describe('Liste des {Domain}s', () => {

        test('affiche la page avec le bouton créer', async ({ page }) => {
          const p = new {Domain}sPage(page)
          await p.goto()
          await expect(page).toHaveURL('/{domain}s')
          await expect(p.createButton).toBeVisible()
        })

        test('redirige vers /login si non authentifié', async ({ page, context }) => {
          await context.clearCookies()
          await page.goto('/{domain}s')
          await expect(page).toHaveURL('/login')
        })

        test('la recherche filtre les résultats', async ({ page }) => {
          const p = new {Domain}sPage(page)
          await p.goto()
          const before = (await p.getCards()).length
          await p.search('zzz_inexistant_zzz')
          const after = await p.getCards()
          expect(after.length).toBeLessThanOrEqual(before)
        })

        test('le bouton créer navigue vers /create', async ({ page }) => {
          const p = new {Domain}sPage(page)
          await p.goto()
          await p.createButton.click()
          await expect(page).toHaveURL('/{domain}s/create')
        })

      })
  - id: 207
    file: 'tests/e2e/{domain}s/crud.spec.ts'
    type: e2e_test
    description: 'Tests e2e CRUD complet {Domain} — create → show → edit → delete.'
    template: |-
      // tests/e2e/{domain}s/crud.spec.ts
      import { test, expect } from '@playwright/test'
      import { {Domain}sPage } from '../pages/{domain}s.page'
      import { createViaApi, deleteViaApi } from '../fixtures/test-helpers'

      test.describe('CRUD {Domain}', () => {

        // Créer un {domain} via API avant les tests (plus rapide que l'UI)
        // et le supprimer après pour garder la base propre
        let test{Domain}Id: number

        test.beforeAll(async ({ request }) => {
          const created = await createViaApi(request, '/{domain}s', {
            // Ajoute ici les champs requis pour créer un {Domain} de test
          })
          test{Domain}Id = created.id
        })

        test.afterAll(async ({ request }) => {
          if (test{Domain}Id) {
            await deleteViaApi(request, '/{domain}s', test{Domain}Id)
          }
        })

        test('affiche le détail via la page show', async ({ page }) => {
          const p = new {Domain}sPage(page)
          await p.gotoShow(test{Domain}Id)
          await expect(page).toHaveURL(`/{domain}s/${test{Domain}Id}/show`)
          await expect(page.getByRole('link', { name: /éditer/i })).toBeVisible()
          await expect(page.getByRole('button', { name: /supprimer/i })).toBeVisible()
        })

        test('crée un {domain} via le formulaire', async ({ page }) => {
          const p = new {Domain}sPage(page)
          await p.gotoCreate()

          // Ajoute ici le remplissage des champs spécifiques au modèle {Domain}
          // Exemple : await page.getByLabel('Nom').fill('Test E2E')

          await page.getByRole('button', { name: /enregistrer/i }).click()
          await expect(page).toHaveURL('/{domain}s', { timeout: 5000 })
          await p.expectSuccessToast()
        })

        test('édite un {domain} via le formulaire', async ({ page }) => {
          const p = new {Domain}sPage(page)
          await p.gotoEdit(test{Domain}Id)
          await expect(page).toHaveURL(`/{domain}s/${test{Domain}Id}/edit`)

          // Ajoute ici la modification d'un champ spécifique
          // Exemple : await page.getByLabel('Nom').fill('Nom modifié')

          await page.getByRole('button', { name: /enregistrer/i }).click()
          await expect(page).toHaveURL('/{domain}s', { timeout: 5000 })
          await p.expectSuccessToast()
        })

        test('supprime un {domain} avec confirmation', async ({ page }) => {
          // Créer un item dédié à la suppression pour ne pas casser les autres tests
          const toDelete = await createViaApi(page.request, '/{domain}s', {
            // Ajoute ici les champs requis
          })

          const p = new {Domain}sPage(page)
          await p.gotoShow(toDelete.id)
          await page.getByRole('button', { name: /supprimer/i }).click()
          await expect(page.getByRole('dialog')).toBeVisible()
          await p.confirmDelete()

          await expect(page).toHaveURL('/{domain}s', { timeout: 5000 })
          await p.expectSuccessToast()
        })

      })
