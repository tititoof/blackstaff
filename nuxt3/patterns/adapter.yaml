# Pattern Blackstaff — adapter
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Adaptateur (Adapter) — Nuxt 3
  description: 'Fait collaborer des objets ayant des interfaces incompatibles. Idéal pour adapter le format Rails (snake_case)
    au format Nuxt (camelCase), adapter une librairie externe, ou convertir un ancien format d''API.'
  whenToUse:
    mustMatch:
    - Adapter le format de réponse Rails (snake_case) au format Nuxt (camelCase)
    - 'Adapter une librairie externe à l''interface interne du projet'
    - 'Adapter un ancien format d''API vers le nouveau sans tout réécrire'
    - 'Adapter les données d''un composant tiers au format attendu par les composables'
    - Isoler la conversion de format dans une seule couche
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - Avoir des formats source et cible bien définis
    - Vouloir éviter les conversions éparpillées dans les composables
    mustNotMatch:
    - Transformer des données à la volée sans interface définie
    - 'Modifier le comportement d''un objet (utiliser Decorator à la place)'
    - 'Créer des familles d''objets (utiliser Abstract Factory à la place)'
    examples:
    - prompt: Adapter les réponses Rails snake_case en camelCase pour Nuxt
      match: true
      reason: 'Conversion d''interface entre deux formats incompatibles.'
    - prompt: Adapter la librairie de dates dayjs à une interface interne
      match: true
      reason: Isole la dépendance externe derrière une interface commune.
    - prompt: Ajouter du cache sur un appel API
      match: false
      reason: Comportement transversal — utiliser Decorator à la place.
    decisionTree:
      question1: As-tu deux interfaces incompatibles à faire collaborer ?
      ifYes:
        question2: Veux-tu isoler la conversion dans une seule couche ?
        ifYes: ✅ Utiliser ce pattern
        ifNo: ⚠️ Utiliser ce pattern mais attention à ne pas éparpiller la logique
      ifNo: ❌ Ne pas utiliser ce pattern
  files:
  - id: 1
    file: 'utils/adapters/{adapter}/interfaces.ts'
    type: type
    description: 'Interfaces source (format externe) et cible (format interne) pour l''adaptateur {Adapter}.'
    template: |-
      // utils/adapters/{adapter}/interfaces.ts
      // Format source (externe — ex: Rails, API tierce)
      export interface {Adapter}Source {
        // Ajoute ici les champs du format source
        // Exemple : created_at: string (snake_case Rails)
      }

      // Format cible (interne — format Nuxt)
      export interface {Adapter}Target {
        // Ajoute ici les champs du format cible
        // Exemple : createdAt: string (camelCase Nuxt)
      }

      // Format paginé source (si applicable)
      export interface {Adapter}SourcePaginated {
        data: {Adapter}Source[]
        meta: {
          current_page: number
          total_count:  number
          per_page:     number
          total_pages:  number
        }
      }

      // Format paginé cible
      export interface {Adapter}TargetPaginated {
        items: {Adapter}Target[]
        meta: {
          page:       number
          total:      number
          perPage:    number
          totalPages: number
        }
      }

      // Interface de l'adaptateur
      export interface {Adapter}Adapter {
        adapt(raw: {Adapter}Source): {Adapter}Target
        adaptList(raw: {Adapter}SourcePaginated): {Adapter}TargetPaginated
      }
  - id: 2
    file: 'utils/adapters/{adapter}/{Adapter}Adapter.ts'
    type: util
    description: 'Implémentation de l''adaptateur {Adapter} et singleton exporté.'
    template: |-
      // utils/adapters/{adapter}/{Adapter}Adapter.ts
      import type {
        {Adapter}Adapter,
        {Adapter}Source,
        {Adapter}Target,
        {Adapter}SourcePaginated,
        {Adapter}TargetPaginated
      } from './interfaces'

      // Implémentation de l'adaptateur
      class {Adapter}AdapterImpl implements {Adapter}Adapter {
        adapt(raw: {Adapter}Source): {Adapter}Target {
          return {
            // Ajoute ici le mapping champ par champ
            // Exemple : createdAt: raw.created_at
          }
        }

        adaptList(raw: {Adapter}SourcePaginated): {Adapter}TargetPaginated {
          return {
            items: raw.data.map(item => this.adapt(item)),
            meta: {
              page:       raw.meta.current_page,
              total:      raw.meta.total_count,
              perPage:    raw.meta.per_page,
              totalPages: raw.meta.total_pages
            }
          }
        }
      }

      // Singleton — l'adaptateur est stateless, une seule instance suffit
      export const {adapter}Adapter = new {Adapter}AdapterImpl()
  - id: 3
    file: 'composables/{adapter}/use{Adapter}s.ts'
    type: composable
    description: 'Composable utilisant l''adaptateur {Adapter} — le reste du projet ne connaît que le format cible.'
    template: |-
      // composables/{adapter}/use{Adapter}s.ts
      import { {adapter}Adapter } from '~/utils/adapters/{adapter}/{Adapter}Adapter'
      import type { {Adapter}Target, {Adapter}TargetPaginated, {Adapter}Source, {Adapter}SourcePaginated } from '~/utils/adapters/{adapter}/interfaces'

      export const use{Adapter}s = () => {
        const { apiFetch } = useApi()

        const list = async (page = 1): Promise<{Adapter}TargetPaginated> => {
          // Rails retourne le format source
          const raw = await apiFetch<{Adapter}SourcePaginated>(`/{adapter}s`, { query: { page } })
          // L'adaptateur convertit en format interne
          return {adapter}Adapter.adaptList(raw)
        }

        const get = async (id: number): Promise<{Adapter}Target> => {
          const raw = await apiFetch<{Adapter}Source>(`/{adapter}s/${id}`)
          return {adapter}Adapter.adapt(raw)
        }

        return { list, get }
      }
  - id: 4
    file: 'tests/utils/adapters/{adapter}/{Adapter}Adapter.spec.ts'
    type: test
    testedFileId: 2
    description: 'Tests unitaires de l''adaptateur {Adapter} — mapping champ par champ.'
    template: |-
      // tests/utils/adapters/{adapter}/{Adapter}Adapter.spec.ts
      import { describe, it, expect } from 'vitest'
      import { {adapter}Adapter } from '~/utils/adapters/{adapter}/{Adapter}Adapter'
      import type { {Adapter}Source, {Adapter}SourcePaginated } from '~/utils/adapters/{adapter}/interfaces'

      const mock{Adapter}Source: {Adapter}Source = {
        // Ajoute ici un exemple de données source
      }

      const mock{Adapter}SourcePaginated: {Adapter}SourcePaginated = {
        data: [mock{Adapter}Source],
        meta: {
          current_page: 1,
          total_count:  1,
          per_page:     10,
          total_pages:  1
        }
      }

      describe('{Adapter}Adapter', () => {

        describe('adapt()', () => {
          it('convertit le format source en format cible', () => {
            const result = {adapter}Adapter.adapt(mock{Adapter}Source)
            expect(result).toBeDefined()
            // Ajoute ici les assertions de mapping
            // Exemple : expect(result.createdAt).toBe(mock{Adapter}Source.created_at)
          })

          it('ne laisse aucun champ snake_case dans le résultat', () => {
            const result = {adapter}Adapter.adapt(mock{Adapter}Source)
            const keys   = Object.keys(result)
            const hasSnakeCase = keys.some(k => k.includes('_'))
            expect(hasSnakeCase).toBe(false)
          })
        })

        describe('adaptList()', () => {
          it('convertit la liste et la pagination', () => {
            const result = {adapter}Adapter.adaptList(mock{Adapter}SourcePaginated)
            expect(result.items).toHaveLength(1)
            expect(result.meta.page).toBe(1)
            expect(result.meta.total).toBe(1)
            expect(result.meta.perPage).toBe(10)
            expect(result.meta.totalPages).toBe(1)
          })

          it('applique adapt() sur chaque item de la liste', () => {
            const result = {adapter}Adapter.adaptList(mock{Adapter}SourcePaginated)
            result.items.forEach(item => {
              const keys = Object.keys(item)
              expect(keys.some(k => k.includes('_'))).toBe(false)
            })
          })
        })

      })
  commentaire: 'Adaptateur générique pour Nuxt 3 + TypeScript. Placeholders : {adapter} (kebab-case) et {Adapter} (PascalCase).
    Exemple : adapter=rails-article, Adapter=RailsArticle.'
  actions:
  - id: 1
    file: 'utils/adapters/{adapter}/interfaces.ts'
    type: type
    description: Interfaces source, cible et adaptateur
  - id: 2
    file: 'utils/adapters/{adapter}/{Adapter}Adapter.ts'
    type: util
    description: 'Implémentation et singleton de l''adaptateur'
  - id: 3
    file: 'composables/{adapter}/use{Adapter}s.ts'
    type: composable
    description: 'Composable utilisant l''adaptateur'
  - id: 4
    file: 'tests/utils/adapters/{adapter}/{Adapter}Adapter.spec.ts'
    type: test
    testedFileId: 2
    description: 'Tests unitaires de l''adaptateur'
