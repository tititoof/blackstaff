# Pattern Blackstaff — singleton
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Singleton — Nuxt 3
  description: 'Garantit qu''une classe n''a qu''une seule instance avec un point d''accès global. ⚠️ Justifier l''usage —
    préférer Pinia pour l''état global, Singleton manuel uniquement pour les utilitaires stateless.'
  whenToUse:
    mustMatch:
    - Créer un cache mémoire partagé entre tous les composables
    - 'Créer un logger centralisé unique pour toute l''application'
    - 'Créer un registry ou pool d''instances partagées'
    - 'Créer une configuration globale d''application (pas un état UI)'
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - Constructeur privé pour empêcher new direct
    - 'Exporter l''instance, jamais la classe'
    mustNotMatch:
    - Créer un CRUD (créer, lire, mettre à jour, supprimer des données)
    - 'Gérer l''état UI ou l''état utilisateur (utiliser Pinia)'
    - Éviter de passer des props entre composants
    - Créer un modèle de données avec des opérations CRUD
    - Créer des formulaires ou des listes paginées
    - Toute instruction mentionnant un modèle de données (Article, User, Product...)
    examples:
    - prompt: Créer un cache mémoire partagé
      match: true
      reason: Utilitaire stateless partagé — Singleton justifié.
    - prompt: Créer un logger centralisé
      match: true
      reason: 'Une seule instance de logger pour toute l''app.'
    - prompt: Créer le CRUD pour Article
      match: false
      reason: CRUD complet — utiliser le pattern crud.
    - prompt: 'Partager l''état utilisateur'
      match: false
      reason: État UI — utiliser Pinia.
    - prompt: Créer un modèle de données avec des champs
      match: false
      reason: Modèle de données — utiliser crud ou rails-crud.
  files:
  - id: 1
    file: 'utils/singleton/{singleton}.ts'
    type: util
    description: 'Singleton {Singleton} — instance unique exportée, constructeur privé.'
    template: |-
      // utils/singleton/{singleton}.ts
      // Singleton — {Singleton}
      // ⚠️ Justification : Ajoute ici pourquoi un Singleton est nécessaire
      // Préférer Pinia pour l'état global — ce Singleton est pour les utilitaires

      class {Singleton}Singleton {
        private static instance: {Singleton}Singleton | null = null

        // Constructeur privé — empêche `new {Singleton}Singleton()` direct
        private constructor() {
          // Ajoute ici l'initialisation
        }

        // Point d'accès unique à l'instance
        static getInstance(): {Singleton}Singleton {
          if (!{Singleton}Singleton.instance) {
            {Singleton}Singleton.instance = new {Singleton}Singleton()
          }
          return {Singleton}Singleton.instance
        }

        // Ajoute ici les méthodes publiques
        // Exemple pour un cache :
        // set<T>(key: string, value: T, ttlMs = 60_000): void { ... }
        // get<T>(key: string): T | null { ... }
        // has(key: string): boolean { ... }
        // invalidate(key: string): void { ... }
        // clear(): void { ... }

        // Pour les tests uniquement — reset de l'instance
        static _resetForTests(): void {
          {Singleton}Singleton.instance = null
        }
      }

      // Export de l'instance unique — JAMAIS la classe
      export const {singleton} = {Singleton}Singleton.getInstance()
  - id: 2
    file: 'tests/utils/singleton/{singleton}.spec.ts'
    type: test
    testedFileId: 1
    description: 'Tests du Singleton {Singleton} — unicité de l''instance et comportement.'
    template: |-
      // tests/utils/singleton/{singleton}.spec.ts
      import { describe, it, expect, beforeEach } from 'vitest'

      // Import de la classe (non exportée normalement — uniquement pour les tests)
      // On teste via l'instance exportée
      import { {singleton} } from '~/utils/singleton/{singleton}'

      describe('{Singleton}Singleton', () => {

        it('l\'instance exportée est définie', () => {
          expect({singleton}).toBeDefined()
        })

        it('deux imports de l\'instance retournent le même objet', async () => {
          const { {singleton}: instance2 } = await import('~/utils/singleton/{singleton}')
          expect({singleton}).toBe(instance2)
        })

        // Ajoute ici les tests des méthodes publiques
        // Exemple pour un cache :
        // it('set() et get() fonctionnent', () => {
        //   {singleton}.set('key', 'value')
        //   expect({singleton}.get('key')).toBe('value')
        // })

        // it('get() retourne null pour une clé inexistante', () => {
        //   expect({singleton}.get('inexistant')).toBeNull()
        // })

        // it('clear() vide toutes les entrées', () => {
        //   {singleton}.set('a', 1)
        //   {singleton}.clear()
        //   expect({singleton}.get('a')).toBeNull()
        // })

      })
  commentaire: 'Singleton générique pour Nuxt 3. Placeholders : {singleton} (kebab-case) et {Singleton} (PascalCase). Exemple
    : singleton=memory-cache, Singleton=MemoryCache.'
  actions:
  - id: 1
    file: 'utils/singleton/{singleton}.ts'
    type: util
    description: Singleton avec constructeur privé et instance exportée
  - id: 2
    file: 'tests/utils/singleton/{singleton}.spec.ts'
    type: test
    testedFileId: 1
    description: Tests unicité et comportement
