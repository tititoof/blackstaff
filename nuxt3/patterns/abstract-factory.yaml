# Pattern Blackstaff — abstract-factory
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Abstract Factory — Nuxt 3
  description: 'Génère une Fabrique Abstraite pour créer des familles d''objets apparentés sans préciser leur classe concrète.
    Idéal pour les familles de composants UI selon le thème, de validators selon le contexte, de formatters selon la locale,
    ou de services selon l''environnement.'
  whenToUse:
    mustMatch:
    - 'Créer des familles d''objets apparentés interchangeables selon un contexte'
    - Créer une fabrique selon le thème light ou dark
    - Créer une fabrique selon la locale fr ou en
    - 'Créer une fabrique selon l''environnement dev ou prod'
    - 'Isoler la création d''objets selon un thème ou une locale'
    - Garantir la cohérence entre plusieurs objets créés ensemble
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - 'Avoir besoin d''un composable pour exposer la fabrique'
    - Utiliser Vuetify pour les composants UI
    - Vouloir éviter des if/switch éparpillés dans les composants
    mustNotMatch:
    - Créer un seul objet isolé (utiliser Factory Method à la place)
    - Créer des objets sans relation entre eux
    - 'N''avoir qu''une seule variante de la famille'
    - Créer le CRUD pour un modèle
    - CRUD complet avec liste, création, édition et suppression
    - Gérer des opérations de création, lecture, mise à jour et suppression
    - Créer des formulaires avec validation pour un modèle de données
    - Créer des pages liste, create, show, edit pour un modèle
    - 'Créer un seul type d''objet (utiliser Factory Method)'
    - 'Créer des notifications, validators ou formatters d''un seul type'
    - Créer une fabrique de notifications (utiliser Factory Method)
    - 'Créer différents types d''un seul objet selon un paramètre type (utiliser Factory Method)'
    - Créer une fabrique de validators ou formatters selon le contexte (utiliser Factory Method)
    examples:
    - prompt: Créer une fabrique de configuration UI selon le thème light/dark
      match: true
      reason: 'Famille cohérente d''objets (button, card, input) avec deux variantes (light/dark).'
    - prompt: Créer une fabrique de validators selon le contexte création/édition
      match: true
      reason: Famille de validators avec deux variantes contextuelles.
    - prompt: Créer un composant bouton générique
      match: false
      reason: Un seul objet isolé, pas une famille — utiliser un simple composant.
    - prompt: Créer une fabrique de formatters selon la locale fr/en
      match: true
      reason: Famille de formatters (date, currency, number) avec variantes par locale.
    decisionTree:
      question1: 'As-tu une famille d''objets apparentés à créer ?'
      ifYes:
        question2: Ces objets doivent-ils être cohérents entre eux selon un contexte (thème, locale, env) ?
        ifYes: ✅ Utiliser ce pattern
        ifNo: ❌ Utiliser Factory Method à la place
      ifNo: ❌ Ne pas utiliser ce pattern
  files:
  - id: 1
    file: 'utils/factories/{factory}/interfaces.ts'
    type: type
    description: 'Interfaces TypeScript pour les produits et la fabrique abstraite {Factory}.'
    template: |-
      // utils/factories/{factory}/interfaces.ts
      // Interfaces des produits de la famille {Factory}

      // Ajoute ici les interfaces des produits de ta famille
      // Exemple pour une famille UI :
      export interface {Factory}ProductA {
        // Ajoute ici les propriétés du produit A
      }

      export interface {Factory}ProductB {
        // Ajoute ici les propriétés du produit B
      }

      // Interface de la fabrique abstraite
      export interface {Factory}Factory {
        createProductA(): {Factory}ProductA
        createProductB(): {Factory}ProductB
        // Ajoute ici les méthodes de création pour chaque produit de la famille
      }
  - id: 2
    file: 'utils/factories/{factory}/{Factory}Factory.ts'
    type: util
    description: 'Fabriques concrètes et fonction de sélection pour {Factory}.'
    template: |-
      // utils/factories/{factory}/{Factory}Factory.ts
      import type {
        {Factory}Factory,
        {Factory}ProductA,
        {Factory}ProductB
      } from './interfaces'

      // Fabrique concrète — variante A (ex: light, creation, fr)
      class {Factory}VariantAFactory implements {Factory}Factory {
        createProductA(): {Factory}ProductA {
          return {
            // Ajoute ici les valeurs pour la variante A
          }
        }

        createProductB(): {Factory}ProductB {
          return {
            // Ajoute ici les valeurs pour la variante A
          }
        }
      }

      // Fabrique concrète — variante B (ex: dark, edition, en)
      class {Factory}VariantBFactory implements {Factory}Factory {
        createProductA(): {Factory}ProductA {
          return {
            // Ajoute ici les valeurs pour la variante B
          }
        }

        createProductB(): {Factory}ProductB {
          return {
            // Ajoute ici les valeurs pour la variante B
          }
        }
      }

      // Sélection de la fabrique selon le contexte
      // Ajoute ici les autres variantes si nécessaire
      export type {Factory}Variant = 'variantA' | 'variantB'

      export const create{Factory}Factory = (variant: {Factory}Variant): {Factory}Factory => {
        const factories: Record<{Factory}Variant, {Factory}Factory> = {
          variantA: new {Factory}VariantAFactory(),
          variantB: new {Factory}VariantBFactory(),
        }
        return factories[variant]
      }
  - id: 3
    file: 'composables/use{Factory}Factory.ts'
    type: composable
    description: 'Composable Nuxt 3 exposant la fabrique {Factory} selon le contexte actif.'
    template: |-
      // composables/use{Factory}Factory.ts
      // Expose la fabrique {Factory} selon le contexte actif
      import {
        create{Factory}Factory,
        type {Factory}Variant
      } from '~/utils/factories/{factory}/{Factory}Factory'
      import type { {Factory}Factory } from '~/utils/factories/{factory}/interfaces'

      export const use{Factory}Factory = (): {Factory}Factory => {
        // Ajoute ici la logique de sélection de la variante
        // Exemples :
        //   const { global } = useTheme()        → pour le thème Vuetify
        //   const { locale } = useI18n()         → pour la locale
        //   const config = useRuntimeConfig()    → pour l'environnement
        //   const route = useRoute()             → pour le contexte de route

        const variant = computed<{Factory}Variant>(() => {
          // Ajoute ici la logique de résolution de la variante active
          return 'variantA'
        })

        return create{Factory}Factory(variant.value)
      }
  - id: 4
    file: 'components/{factory}/{Factory}Consumer.vue'
    type: component
    description: 'Composant exemple consommant la fabrique {Factory} via le composable.'
    template: |-
      <!-- components/{factory}/{Factory}Consumer.vue -->
      <!-- Exemple de composant consommant la fabrique {Factory} -->
      <!-- Le composant ne connaît que les interfaces, jamais les classes concrètes -->
      <template>
        <div>
          <!-- Ajoute ici le template utilisant configA et configB -->
        </div>
      </template>

      <script setup lang="ts">
      interface Props {
        // Ajoute ici les props spécifiques au composant
      }

      const props = defineProps<Props>()

      // La fabrique choisit la bonne implémentation selon le contexte actif
      const factory  = use{Factory}Factory()
      const configA  = computed(() => factory.createProductA())
      const configB  = computed(() => factory.createProductB())
      </script>
  - id: 5
    file: 'tests/utils/factories/{factory}/{Factory}Factory.spec.ts'
    type: test
    testedFileId: 2
    description: Tests unitaires des fabriques concrètes et de la fonction de sélection.
    template: |-
      // tests/utils/factories/{factory}/{Factory}Factory.spec.ts
      import { describe, it, expect } from 'vitest'
      import { create{Factory}Factory } from '~/utils/factories/{factory}/{Factory}Factory'

      describe('{Factory}Factory', () => {

        describe('VariantA', () => {
          const factory = create{Factory}Factory('variantA')

          it('createProductA() retourne la config variante A', () => {
            const product = factory.createProductA()
            expect(product).toBeDefined()
            // Ajoute ici les assertions spécifiques à la variante A
          })

          it('createProductB() retourne la config variante A', () => {
            const product = factory.createProductB()
            expect(product).toBeDefined()
            // Ajoute ici les assertions spécifiques à la variante A
          })
        })

        describe('VariantB', () => {
          const factory = create{Factory}Factory('variantB')

          it('createProductA() retourne la config variante B', () => {
            const product = factory.createProductA()
            expect(product).toBeDefined()
            // Ajoute ici les assertions spécifiques à la variante B
          })

          it('createProductB() retourne la config variante B', () => {
            const product = factory.createProductB()
            expect(product).toBeDefined()
            // Ajoute ici les assertions spécifiques à la variante B
          })
        })

        describe('Cohérence de la famille', () => {
          it('les deux variantes implémentent toutes les méthodes de l\'interface', () => {
            const variantA = create{Factory}Factory('variantA')
            const variantB = create{Factory}Factory('variantB')
            expect(typeof variantA.createProductA).toBe('function')
            expect(typeof variantA.createProductB).toBe('function')
            expect(typeof variantB.createProductA).toBe('function')
            expect(typeof variantB.createProductB).toBe('function')
          })

          it('les produits A et B sont distincts entre variantes', () => {
            const variantA = create{Factory}Factory('variantA')
            const variantB = create{Factory}Factory('variantB')
            expect(variantA.createProductA()).not.toEqual(variantB.createProductA())
          })
        })

      })
  - id: 6
    file: 'tests/composables/use{Factory}Factory.spec.ts'
    type: test
    testedFileId: 3
    description: 'Tests du composable use{Factory}Factory — retourne la bonne fabrique selon le contexte.'
    template: |-
      // tests/composables/use{Factory}Factory.spec.ts
      import { describe, it, expect, vi } from 'vitest'
      import { use{Factory}Factory } from '~/composables/use{Factory}Factory'

      describe('use{Factory}Factory', () => {

        it('retourne une fabrique avec toutes les méthodes de création', () => {
          const factory = use{Factory}Factory()
          expect(typeof factory.createProductA).toBe('function')
          expect(typeof factory.createProductB).toBe('function')
        })

        it('les produits retournés sont définis', () => {
          const factory  = use{Factory}Factory()
          expect(factory.createProductA()).toBeDefined()
          expect(factory.createProductB()).toBeDefined()
        })

        // Ajoute ici les tests de changement de contexte
        // Exemple pour le thème :
        // it('retourne la fabrique dark quand le thème est dark', () => { ... })
      })
  commentaire: 'Fabrique Abstraite générique pour Nuxt 3 + TypeScript. Les placeholders {factory} (kebab-case) et {Factory}
    (PascalCase) doivent être remplacés par le nom de la fabrique (ex: ui, validator, formatter).'
  actions:
