# Pattern Blackstaff — porotype
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Prototype — Nuxt 3
  description: Crée de nouveaux objets en clonant des prototypes existants. Idéal pour dupliquer des articles, créer des templates
    de payloads, ou cloner un état de formulaire.
  whenToUse:
    mustMatch:
    - Cloner un formulaire avec des valeurs pré-remplies
    - Dupliquer un objet existant avec des variantes mineures
    - 'Créer des templates réutilisables à partir d''un modèle de base'
    - Cloner un état pour comparaison avant/après modification
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - Avoir des prototypes pré-définis comme constantes immuables
    - Utiliser cloneWith() pour les variantes sans modifier le prototype
    mustNotMatch:
    - Créer un objet from scratch (pas besoin de prototype)
    - 'Partager l''état entre instances (Prototype crée des copies indépendantes)'
    examples:
    - prompt: 'Dupliquer un article existant avec ''Copie de...'''
      match: true
      reason: Clone avec override du titre.
    - prompt: 'Créer des templates d''articles pré-remplis'
      match: true
      reason: Prototypes immuables clonables.
    - prompt: Créer un article from scratch
      match: false
      reason: Pas de prototype source — utiliser directement le formulaire.
  files:
  - id: 1
    file: 'utils/prototype/{prototype}/{Prototype}Template.ts'
    type: util
    description: 'Classe Prototype clonable pour {Prototype} avec templates pré-définis.'
    template: |-
      // utils/prototype/{prototype}/{Prototype}Template.ts
      // Prototype — template clonable pour {Prototype}

      // Interface Cloneable — tout prototype l'implémente
      export interface Cloneable<T> {
        clone(): T
      }

      export class {Prototype}Template implements Cloneable<{Prototype}Template> {
        constructor(
          // Ajoute ici les champs du template
          // Exemple : public title: string = '', public content: string = ''
        ) {}

        // Clone superficiel — copie indépendante
        clone(): {Prototype}Template {
          return new {Prototype}Template(
            // Ajoute ici les champs à copier
          )
        }

        // Clone avec surcharges partielles — jamais de mutation du prototype original
        cloneWith(overrides: Partial<Record<string, unknown>>): {Prototype}Template {
          const cloned = this.clone()
          Object.assign(cloned, overrides)
          return cloned
        }

        // Convertit en payload pour l'API
        toPayload(): Record<string, unknown> {
          return {
            // Ajoute ici les champs du payload
          }
        }
      }

      // Templates pré-définis — prototypes immuables (`as const`)
      // Toujours cloner avant utilisation — jamais modifier directement
      export const {PROTOTYPE}_TEMPLATES = {
        default: new {Prototype}Template(
          // Ajoute ici les valeurs du template par défaut
        ),
        // Ajoute ici d'autres templates prédéfinis
      } as const
  - id: 2
    file: 'composables/{prototype}/use{Prototype}Duplicate.ts'
    type: composable
    description: 'Composable utilisant le Prototype pour dupliquer un {Prototype} existant.'
    template: |-
      // composables/{prototype}/use{Prototype}Duplicate.ts
      import { {Prototype}Template, {PROTOTYPE}_TEMPLATES } from '~/utils/prototype/{prototype}/{Prototype}Template'

      export const use{Prototype}Duplicate = () => {
        // Crée un prototype depuis un objet existant
        const fromExisting = (item: Record<string, unknown>): {Prototype}Template => {
          return new {Prototype}Template(
            // Ajoute ici le mapping depuis l'objet existant
            // Exemple : `Copie de ${item.title}`, item.content
          )
        }

        // Duplique via le prototype — crée et envoie à l'API
        const duplicate = async (item: Record<string, unknown>) => {
          const template = fromExisting(item)
          // Ajoute ici l'appel à l'API
          // const { create } = use{Prototype}s()
          // return await create(template.toPayload())
          return template.toPayload()
        }

        // Initialise depuis un template pré-défini
        const fromTemplate = (key: keyof typeof {PROTOTYPE}_TEMPLATES) => {
          // Toujours cloner — jamais modifier le prototype original
          return {PROTOTYPE}_TEMPLATES[key].clone()
        }

        return { fromExisting, duplicate, fromTemplate }
      }
  - id: 3
    file: 'tests/utils/prototype/{prototype}/{Prototype}Template.spec.ts'
    type: test
    testedFileId: 1
    description: 'Tests du Prototype {Prototype} — clone indépendant, cloneWith, templates.'
    template: |-
      // tests/utils/prototype/{prototype}/{Prototype}Template.spec.ts
      import { describe, it, expect } from 'vitest'
      import { {Prototype}Template, {PROTOTYPE}_TEMPLATES } from '~/utils/prototype/{prototype}/{Prototype}Template'

      describe('{Prototype}Template', () => {

        describe('clone()', () => {
          it('retourne une instance indépendante', () => {
            const original = new {Prototype}Template()
            const cloned   = original.clone()
            expect(cloned).not.toBe(original)
          })

          it('la copie a les mêmes valeurs que l\'original', () => {
            const original = new {Prototype}Template()
            const cloned   = original.clone()
            expect(cloned.toPayload()).toEqual(original.toPayload())
          })

          it('modifier la copie ne modifie pas l\'original', () => {
            const original = new {Prototype}Template()
            const cloned   = original.clone()
            // Ajoute ici une modification sur cloned
            // cloned.someField = 'modified'
            // expect(original.someField).not.toBe('modified')
            expect(cloned).not.toBe(original)
          })
        })

        describe('cloneWith()', () => {
          it('applique les overrides sans modifier l\'original', () => {
            const original = new {Prototype}Template()
            const variant  = original.cloneWith({ /* overrides */ })
            expect(variant).not.toBe(original)
          })
        })

        describe('{PROTOTYPE}_TEMPLATES', () => {
          it('les templates pré-définis sont définis', () => {
            expect({PROTOTYPE}_TEMPLATES.default).toBeDefined()
          })

          it('cloner un template retourne une copie indépendante', () => {
            const clone = {PROTOTYPE}_TEMPLATES.default.clone()
            expect(clone).not.toBe({PROTOTYPE}_TEMPLATES.default)
          })
        })

        describe('toPayload()', () => {
          it('retourne un objet sérialisable', () => {
            const payload = new {Prototype}Template().toPayload()
            expect(typeof payload).toBe('object')
            expect(() => JSON.stringify(payload)).not.toThrow()
          })
        })

      })
  commentaire: 'Prototype générique pour Nuxt 3. Placeholders : {prototype} (kebab-case), {Prototype} (PascalCase), {PROTOTYPE}
    (SCREAMING_SNAKE_CASE). Exemple : prototype=article, Prototype=Article, PROTOTYPE=ARTICLE.'
  actions:
  - id: 1
    file: 'utils/prototype/{prototype}/{Prototype}Template.ts'
    type: util
    description: Classe Prototype clonable et templates pré-définis
  - id: 2
    file: 'composables/{prototype}/use{Prototype}Duplicate.ts'
    type: composable
    description: Composable de duplication via Prototype
  - id: 3
    file: 'tests/utils/prototype/{prototype}/{Prototype}Template.spec.ts'
    type: test
    testedFileId: 1
    description: Tests clone, cloneWith et templates
