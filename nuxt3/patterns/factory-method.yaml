# Pattern Blackstaff — factory-method
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Fabrique (Factory Method) — Nuxt 3
  description: 'Définit une interface pour la création d''objets et délègue aux sous-classes le choix du type concret. Centralise
    la logique de création — jamais de `new` direct dans les composables.'
  whenToUse:
    mustMatch:
    - 'Créer une fabrique pour différents types d''un même objet'
    - Fabrique de notifications selon le type (success, error, warning)
    - 'Créer différents types d''objets selon un paramètre'
    - 'Centraliser la création d''objets sans new direct dans les composables'
    - Factory pour validators, formatters ou renderers selon le contexte
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - 'Avoir plusieurs variantes d''un même concept (success/error/warning)'
    - Exposer la factory via un composable
    mustNotMatch:
    - 'Créer des familles d''objets liés (utiliser Abstract Factory)'
    - 'Un seul type d''objet sans variante (pas besoin de factory)'
    - Créer le CRUD pour un modèle
    - CRUD complet avec liste, création, édition et suppression
    - Gérer des opérations de création, lecture, mise à jour et suppression
    - Créer des formulaires avec validation pour un modèle de données
    - Créer des pages liste, create, show, edit pour un modèle
    - 'Créer des familles d''objets selon un thème, locale ou environnement (utiliser Abstract Factory)'
    - 'Avoir plusieurs variantes cohérentes d''objets liés (utiliser Abstract Factory)'
    examples:
    - prompt: Créer une factory de notifications (success, error, warning, info)
      match: true
      reason: 'Plusieurs types d''un même concept centralisés.'
    - prompt: Créer une factory de validators selon le domaine
      match: true
      reason: Différents types de validators selon le contexte.
    - prompt: Créer un seul composant bouton
      match: false
      reason: Un seul type — pas besoin de factory.
  files:
  - id: 1
    file: 'utils/factories/{factory}/{Factory}Types.ts'
    type: type
    description: 'Types, interface produit et classes concrètes pour la factory {Factory}.'
    template: |-
      // utils/factories/{factory}/{Factory}Types.ts
      // Factory Method — types et classes pour {Factory}

      // Types disponibles
      export type {Factory}Type = 'typeA' | 'typeB' | 'typeC'
      // Exemple : export type NotificationType = 'success' | 'error' | 'warning' | 'info'

      // Interface produit — la factory retourne toujours cette interface
      export interface {Factory}Product {
        type:     {Factory}Type
        // Ajoute ici les propriétés communes à tous les types
        execute(): void
      }

      // Classe de base abstraite
      abstract class Base{Factory}Product implements {Factory}Product {
        abstract type: {Factory}Type
        // Ajoute ici les propriétés communes

        constructor(
          // Ajoute ici les paramètres communs
        ) {}

        execute(): void {
          // Comportement par défaut — peut être surchargé
          console.log(`[${this.type}] execute()`)
        }
      }

      // Classes concrètes — une par type
      class TypeA{Factory}Product extends Base{Factory}Product {
        type: {Factory}Type = 'typeA'
        // Ajoute ici les spécificités du type A
      }

      class TypeB{Factory}Product extends Base{Factory}Product {
        type: {Factory}Type = 'typeB'
        // Ajoute ici les spécificités du type B

        execute(): void {
          // Comportement spécifique au type B
          super.execute()
        }
      }

      class TypeC{Factory}Product extends Base{Factory}Product {
        type: {Factory}Type = 'typeC'
        // Ajoute ici les spécificités du type C
      }

      // Registre des classes concrètes — facile à étendre
      const {FACTORY}_MAP: Record<{Factory}Type, new (...args: unknown[]) => {Factory}Product> = {
        typeA: TypeA{Factory}Product as any,
        typeB: TypeB{Factory}Product as any,
        typeC: TypeC{Factory}Product as any,
      }

      export { {FACTORY}_MAP }
  - id: 2
    file: 'utils/factories/{factory}/{Factory}Factory.ts'
    type: util
    description: 'Factory Method pour {Factory} — point de création centralisé.'
    template: |-
      // utils/factories/{factory}/{Factory}Factory.ts
      import { {FACTORY}_MAP } from './{Factory}Types'
      import type { {Factory}Type, {Factory}Product } from './{Factory}Types'

      // Factory Method — crée le bon type selon le paramètre
      // Retourne TOUJOURS l'interface, jamais la classe concrète
      export const create{Factory} = (
        type: {Factory}Type,
        // Ajoute ici les paramètres communs à tous les types
      ): {Factory}Product => {
        const ProductClass = {FACTORY}_MAP[type]
        if (!ProductClass) {
          throw new Error(`[{Factory}Factory] Type inconnu : ${type}`)
        }
        return new ProductClass(/* Ajoute ici les paramètres */)
      }
  - id: 3
    file: 'composables/use{Factory}.ts'
    type: composable
    description: 'Composable exposant la factory {Factory} — les pages passent uniquement par ce composable.'
    template: |-
      // composables/use{Factory}.ts
      import { create{Factory} } from '~/utils/factories/{factory}/{Factory}Factory'
      import type { {Factory}Type } from '~/utils/factories/{factory}/{Factory}Types'

      export const use{Factory} = () => {
        const execute = (type: {Factory}Type, /* Ajoute ici les paramètres */) => {
          // La factory crée le bon objet — jamais de new dans le composable
          const product = create{Factory}(type)
          product.execute()
          return product
        }

        // Raccourcis par type (optionnel)
        const typeA = (/* paramètres */) => execute('typeA')
        const typeB = (/* paramètres */) => execute('typeB')
        const typeC = (/* paramètres */) => execute('typeC')

        return { execute, typeA, typeB, typeC }
      }
  - id: 4
    file: 'tests/utils/factories/{factory}/{Factory}Factory.spec.ts'
    type: test
    testedFileId: 2
    description: 'Tests de la factory {Factory} — création des bons types et interface.'
    template: |-
      // tests/utils/factories/{factory}/{Factory}Factory.spec.ts
      import { describe, it, expect } from 'vitest'
      import { create{Factory} } from '~/utils/factories/{factory}/{Factory}Factory'

      describe('{Factory}Factory', () => {

        it('create{Factory}(typeA) retourne un produit de type typeA', () => {
          const product = create{Factory}('typeA')
          expect(product.type).toBe('typeA')
        })

        it('create{Factory}(typeB) retourne un produit de type typeB', () => {
          const product = create{Factory}('typeB')
          expect(product.type).toBe('typeB')
        })

        it('create{Factory}(typeC) retourne un produit de type typeC', () => {
          const product = create{Factory}('typeC')
          expect(product.type).toBe('typeC')
        })

        it('tous les produits implémentent l\'interface {Factory}Product', () => {
          const types: Array<Parameters<typeof create{Factory}>[0]> = ['typeA', 'typeB', 'typeC']
          types.forEach(type => {
            const product = create{Factory}(type)
            expect(typeof product.type).toBe('string')
            expect(typeof product.execute).toBe('function')
          })
        })

        it('lève une erreur pour un type inconnu', () => {
          expect(() => create{Factory}('unknown' as any)).toThrow()
        })

        it('deux appels avec le même type créent des instances distinctes', () => {
          const a = create{Factory}('typeA')
          const b = create{Factory}('typeA')
          expect(a).not.toBe(b)
        })

      })
  commentaire: 'Factory Method générique pour Nuxt 3. Placeholders : {factory} (kebab-case), {Factory} (PascalCase), {FACTORY}
    (SCREAMING_SNAKE_CASE). Exemple : factory=notification, Factory=Notification, FACTORY=NOTIFICATION.'
  actions:
  - id: 1
    file: 'utils/factories/{factory}/{Factory}Types.ts'
    type: type
    description: Types, interface produit et classes concrètes
  - id: 2
    file: 'utils/factories/{factory}/{Factory}Factory.ts'
    type: util
    description: Factory Method — point de création centralisé
  - id: 3
    file: 'composables/use{Factory}.ts'
    type: composable
    description: Composable exposant la factory
  - id: 4
    file: 'tests/utils/factories/{factory}/{Factory}Factory.spec.ts'
    type: test
    testedFileId: 2
    description: Tests de la factory
