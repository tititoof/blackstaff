# Pattern Blackstaff — bridge
# Éditer librement les templates (bloc | multi-lignes)
# Après édition : python3 yaml-to-json.py ./nuxt3/patterns/
---
pattern:
  name: Pont (Bridge) — Nuxt 3
  description: 'Sépare une abstraction de son implémentation pour qu''elles évoluent indépendamment. Idéal pour découpler
    la logique métier (préparer les données) du détail technique (rendre/exporter les données).'
  whenToUse:
    mustMatch:
    - 'Séparer la logique d''affichage de son système de rendu'
    - 'Séparer la logique d''export du format de sortie (PDF, CSV, JSON)'
    - 'Séparer la logique de notification du canal d''envoi (toast, email, push)'
    - Séparer la logique de validation du moteur de validation
    - Avoir deux axes de variation indépendants
    shouldMatch:
    - Utiliser Nuxt 3 avec TypeScript
    - Vouloir ajouter un format ou un canal sans impacter la logique métier
    - Utiliser une factory pour assembler abstraction et implémentation
    mustNotMatch:
    - 'N''avoir qu''un seul format ou canal de sortie (pas besoin de pont)'
    - Adapter deux interfaces incompatibles (utiliser Adapter à la place)
    - 'Créer des familles d''objets cohérents (utiliser Abstract Factory)'
    examples:
    - prompt: 'Créer un système d''export articles en CSV et JSON'
      match: true
      reason: 'Logique d''export (abstraction) séparée du format (implémentation).'
    - prompt: Créer un système de notification avec toast et email
      match: true
      reason: Logique de notification (abstraction) séparée du canal (implémentation).
    - prompt: Adapter le format Rails en camelCase
      match: false
      reason: 'Conversion d''interface — utiliser Adapter à la place.'
    decisionTree:
      question1: As-tu une logique métier et un détail technique qui doivent évoluer indépendamment ?
      ifYes:
        question2: Ces deux dimensions varient-elles selon des axes différents ?
        ifYes: ✅ Utiliser ce pattern
        ifNo: ⚠️ Envisager un simple Strategy à la place
      ifNo: ❌ Ne pas utiliser ce pattern
  files:
  - id: 1
    file: 'utils/bridge/{bridge}/interfaces.ts'
    type: type
    description: 'Interface du renderer (implémentation) pour le pont {Bridge}.'
    template: |-
      // utils/bridge/{bridge}/interfaces.ts

      // Interface de l'implémentation — le détail technique
      export interface {Bridge}Renderer {
        render(data: Record<string, unknown>[], context: string): void
        // Ajoute ici les méthodes spécifiques au renderer
      }

      // Types de formats/canaux disponibles
      export type {Bridge}Format = 'formatA' | 'formatB'
      // Exemple : export type ExportFormat = 'csv' | 'json'
      //           export type NotificationChannel = 'toast' | 'email'
  - id: 2
    file: 'utils/bridge/{bridge}/{Bridge}Renderers.ts'
    type: util
    description: Implémentations concrètes du renderer pour chaque format/canal.
    template: |-
      // utils/bridge/{bridge}/{Bridge}Renderers.ts
      import type { {Bridge}Renderer, {Bridge}Format } from './interfaces'

      // Implémentation concrète — format/canal A
      class {Bridge}RendererA implements {Bridge}Renderer {
        render(data: Record<string, unknown>[], context: string): void {
          // Ajoute ici le rendu format A
          // Exemple CSV : générer le blob et déclencher le téléchargement
        }
      }

      // Implémentation concrète — format/canal B
      class {Bridge}RendererB implements {Bridge}Renderer {
        render(data: Record<string, unknown>[], context: string): void {
          // Ajoute ici le rendu format B
          // Exemple JSON : sérialiser et télécharger
        }
      }

      // Registry des renderers
      export const {bridge}Renderers: Record<{Bridge}Format, {Bridge}Renderer> = {
        formatA: new {Bridge}RendererA(),
        formatB: new {Bridge}RendererB(),
      }
  - id: 3
    file: 'utils/bridge/{bridge}/{Bridge}Abstraction.ts'
    type: util
    description: 'Abstraction et abstractions concrètes du pont {Bridge} — logique métier.'
    template: |-
      // utils/bridge/{bridge}/{Bridge}Abstraction.ts
      import type { {Bridge}Renderer, {Bridge}Format } from './interfaces'
      import { {bridge}Renderers } from './{Bridge}Renderers'

      // Abstraction de base — logique commune
      export abstract class {Bridge}Abstraction {
        constructor(protected renderer: {Bridge}Renderer) {}

        // Point d'entrée commun
        execute(data: Record<string, unknown>[], context: string): void {
          const prepared = this.prepare(data)
          this.renderer.render(prepared, context)
        }

        // Chaque abstraction concrète prépare les données différemment
        protected abstract prepare(data: Record<string, unknown>[]): Record<string, unknown>[]
      }

      // Abstraction concrète — logique métier spécifique
      export class {Bridge}ConcreteAbstraction extends {Bridge}Abstraction {
        protected prepare(data: Record<string, unknown>[]): Record<string, unknown>[] {
          // Ajoute ici la transformation des données avant rendu
          // Exemple : sélectionner/renommer les colonnes pour l'export
          return data.map(item => ({
            // Ajoute ici le mapping des champs
          }))
        }
      }

      // Factory — assemble abstraction + implémentation
      export const create{Bridge} = (
        type: 'concrete',
        format: {Bridge}Format
      ): {Bridge}Abstraction => {
        const renderer = {bridge}Renderers[format]
        const abstractions = {
          concrete: {Bridge}ConcreteAbstraction
        }
        return new abstractions[type](renderer)
      }
  - id: 4
    file: 'composables/use{Bridge}.ts'
    type: composable
    description: 'Composable exposant le pont {Bridge} — les pages ne connaissent que ce composable.'
    template: |-
      // composables/use{Bridge}.ts
      import { create{Bridge} } from '~/utils/bridge/{bridge}/{Bridge}Abstraction'
      import type { {Bridge}Format } from '~/utils/bridge/{bridge}/interfaces'

      export const use{Bridge} = () => {
        const execute = (
          data: Record<string, unknown>[],
          format: {Bridge}Format,
          context: string
        ) => {
          // Bridge : l'abstraction et le renderer évoluent séparément
          const bridge = create{Bridge}('concrete', format)
          bridge.execute(data, context)
        }

        return { execute }
      }
  - id: 5
    file: 'tests/utils/bridge/{bridge}/{Bridge}Abstraction.spec.ts'
    type: test
    testedFileId: 3
    description: 'Tests unitaires de l''abstraction et de la factory du pont {Bridge}.'
    template: |-
      // tests/utils/bridge/{bridge}/{Bridge}Abstraction.spec.ts
      import { describe, it, expect, vi } from 'vitest'
      import { create{Bridge}, {Bridge}ConcreteAbstraction } from '~/utils/bridge/{bridge}/{Bridge}Abstraction'
      import type { {Bridge}Renderer } from '~/utils/bridge/{bridge}/interfaces'

      const mockRenderer: {Bridge}Renderer = {
        render: vi.fn()
      }

      const mockData = [
        { id: 1 },
        { id: 2 }
      ]

      describe('{Bridge}Abstraction', () => {

        beforeEach(() => vi.clearAllMocks())

        it('execute() prépare les données et appelle le renderer', () => {
          const bridge = new {Bridge}ConcreteAbstraction(mockRenderer)
          bridge.execute(mockData, 'test')
          expect(mockRenderer.render).toHaveBeenCalledOnce()
        })

        it('le renderer reçoit les données préparées', () => {
          const bridge = new {Bridge}ConcreteAbstraction(mockRenderer)
          bridge.execute(mockData, 'test')
          const [calledData] = (mockRenderer.render as any).mock.calls[0]
          expect(Array.isArray(calledData)).toBe(true)
        })

        it('create{Bridge}() assemble la bonne abstraction avec le bon renderer', () => {
          const bridge = create{Bridge}('concrete', 'formatA')
          expect(bridge).toBeInstanceOf({Bridge}ConcreteAbstraction)
        })

        it('changer de format ne modifie pas la logique de préparation', () => {
          const bridgeA = create{Bridge}('concrete', 'formatA')
          const bridgeB = create{Bridge}('concrete', 'formatB')
          // Les deux utilisent la même logique de préparation
          expect(bridgeA).toBeInstanceOf({Bridge}ConcreteAbstraction)
          expect(bridgeB).toBeInstanceOf({Bridge}ConcreteAbstraction)
        })

      })
  - id: 6
    file: 'tests/utils/bridge/{bridge}/{Bridge}Renderers.spec.ts'
    type: test
    testedFileId: 2
    description: 'Tests unitaires des renderers concrets du pont {Bridge}.'
    template: |-
      // tests/utils/bridge/{bridge}/{Bridge}Renderers.spec.ts
      import { describe, it, expect } from 'vitest'
      import { {bridge}Renderers } from '~/utils/bridge/{bridge}/{Bridge}Renderers'

      const mockData = [{ id: 1, name: 'Test' }]

      describe('{Bridge}Renderers', () => {

        it('le registry contient tous les formats', () => {
          expect({bridge}Renderers.formatA).toBeDefined()
          expect({bridge}Renderers.formatB).toBeDefined()
        })

        it('formatA — render() ne lève pas d\'erreur', () => {
          expect(() => {
            {bridge}Renderers.formatA.render(mockData, 'test')
          }).not.toThrow()
        })

        it('formatB — render() ne lève pas d\'erreur', () => {
          expect(() => {
            {bridge}Renderers.formatB.render(mockData, 'test')
          }).not.toThrow()
        })

      })
  commentaire: 'Pont générique pour Nuxt 3 + TypeScript. Placeholders : {bridge} (kebab-case) et {Bridge} (PascalCase). Exemple
    : bridge=export, Bridge=Export.'
  actions:
  - id: 1
    file: 'utils/bridge/{bridge}/interfaces.ts'
    type: type
    description: Interface du renderer et types de formats
  - id: 2
    file: 'utils/bridge/{bridge}/{Bridge}Renderers.ts'
    type: util
    description: Implémentations concrètes des renderers
  - id: 3
    file: 'utils/bridge/{bridge}/{Bridge}Abstraction.ts'
    type: util
    description: Abstraction, abstractions concrètes et factory
  - id: 4
    file: 'composables/use{Bridge}.ts'
    type: composable
    description: Composable exposant le pont
  - id: 5
    file: 'tests/utils/bridge/{bridge}/{Bridge}Abstraction.spec.ts'
    type: test
    testedFileId: 3
    description: 'Tests de l''abstraction et factory'
  - id: 6
    file: 'tests/utils/bridge/{bridge}/{Bridge}Renderers.spec.ts'
    type: test
    testedFileId: 2
    description: Tests des renderers concrets
